<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RKH LIMS — Admin Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f2027; color: #eee; margin: 0; padding: 40px; }
  .card { background: #16303a; border-radius: 10px; padding: 24px; max-width: 640px; margin: 0 auto 20px; }
  h1 { font-size: 20px; }
  input { width: 100%; padding: 10px; margin: 6px 0 14px; border-radius: 6px; border: none; box-sizing: border-box; }
  button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; }
  .approve { background: #2e7d32; color: white; }
  .reject { background: #c62828; color: white; }
  .login-btn { background: #00bcd4; color: white; width: 100%; }
  .error { color: #ff8a80; margin-top: 8px; }
  .lab-row { border-bottom: 1px solid #234; padding: 12px 0; }
  #dashboard { display: none; }
</style>
</head>
<body>

  <div class="card" id="loginCard">
    <h1>Admin Login</h1>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button class="login-btn" onclick="login()">Log In</button>
    <p class="error" id="loginError"></p>
  </div>

  <div class="card" id="dashboard">
    <h1>Pending Lab Approvals</h1>
    <div id="labList">Loading...</div>
    <p class="error" id="dashError"></p>
  </div>

<script>
  let token = null;

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.message || 'Login failed';
        return;
      }

      token = data.token;
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadPendingLabs();
    } catch (err) {
      errEl.textContent = 'Network error. Please try again.';
    }
  }

  async function loadPendingLabs() {
    const listEl = document.getElementById('labList');
    const errEl = document.getElementById('dashError');
    errEl.textContent = '';

    try {
      const res = await fetch('/api/admin/labs/pending', {
        headers: { Authorization: 'Bearer ' + token }
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.message || 'Failed to load labs';
        return;
      }

      if (data.length === 0) {
        listEl.innerHTML = '<p>No pending labs right now.</p>';
        return;
      }

      listEl.innerHTML = data.map(lab => `
        <div class="lab-row">
          <strong>${lab.labName}</strong><br>
          ${lab.email} — Admin: ${lab.adminName}<br>
          <button class="approve" onclick="decide('${lab._id}', 'approve')">Approve</button>
          <button class="reject" onclick="decide('${lab._id}', 'reject')">Reject</button>
        </div>
      `).join('');
    } catch (err) {
      errEl.textContent = 'Network error loading labs.';
    }
  }

  async function decide(labId, action) {
    try {
      const res = await fetch(`/api/admin/labs/${labId}/${action}`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token }
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.message || 'Action failed');
        return;
      }

      loadPendingLabs(); // refresh list
    } catch (err) {
      alert('Network error. Please try again.');
    }
  }
</script>
</body>
</html>
